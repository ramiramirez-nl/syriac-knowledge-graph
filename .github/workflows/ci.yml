name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A failing run should block the Pages deploy, so this workflow is the gate:
# pages.yml waits for it via workflow_run.
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile all Python sources
        run: uv run python -m compileall -q api scripts tests main.py

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Data integrity check
        # Non-blocking warnings (e.g. duplicate DOI groups) exit 0; real
        # referential-integrity errors exit non-zero and fail the build.
        run: uv run python scripts/check_data.py

      - name: Deployment preflight (static target)
        # Catches the failure mode CI would otherwise miss: publishing a
        # site/data.json that is older than the database it claims to show.
        run: uv run python scripts/preflight.py --target pages
