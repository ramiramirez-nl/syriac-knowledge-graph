<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Syriac Studies Knowledge Graph</title>
    <style>
        body { font-family: sans-serif; background: #f4f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        .card h2 { margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 4px; background: #2f6fd1; color: white; cursor: pointer; }
        button:hover { background: #1a4f9e; }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { border-bottom: 2px solid #2f6fd1; font-weight: bold; }
        #error { color: red; margin-top: 10px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
        </div>
        <input type="text" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="submitBtn" onclick="submitAuth()">Login</button>
        <div id="error"></div>
        <div style="text-align: center; margin-top: 15px;"><a href="/">Back to App</a></div>
    </div>
    
    <script>
        let mode = 'login';
        
        function switchTab(m) {
            mode = m;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('submitBtn').innerText = mode === 'login' ? 'Login' : 'Register';
            document.getElementById('error').innerText = '';
        }
        
        async function submitAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) {
                document.getElementById('error').innerText = 'Email and password required.';
                return;
            }
            
            try {
                const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/profile.html';
                } else {
                    document.getElementById('error').innerText = data.detail || 'Authentication failed.';
                }
            } catch (e) {
                document.getElementById('error').innerText = 'Network error.';
            }
        }
    </script>
</body>
</html>
